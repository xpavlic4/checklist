<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'owners')}">


<body>

<h2 th:text="#{case}">Case</h2>

<div th:if="${message}" class="alert alert-success" id="success-message">
  <span th:text="${message}"></span>
</div>

<div th:if="${error}" class="alert alert-danger" id="error-message">
  <span th:text="${error}"></span>
</div>


<table class="table table-striped" th:object="${case}">
  <tr>
    <th th:text="#{number}">ID</th>
    <td><b th:text="*{id}"></b></td>
  </tr>
  <tr>
    <th th:text="#{identificator}">Identificator</th>
    <td><b th:text="*{name}"></b></td>
  </tr>
</table>

<a th:href="@{__${case.id}__/edit}" class="btn btn-primary" th:text="#{edit}">Edit</a>
<a th:href="@{/cases/__${case.id}__/export}" download class="btn btn-primary">Export Excel</a>
<a th:href="@{/cases/__${case.id}__/tree}" class="btn btn-primary" th:text="#{showTree}">Tree</a>
<br/>
<br/>
<a th:href="@{/reports/__${case.id}__}" class="btn btn-success" th:text="#{computeReport}">Compute Report</a>

<br/>
<br/>
<h2 th:text="#{arguments}">Arguments</h2>
<a th:href="@{__${case.id}__/arguments/new}" class="btn btn-primary" th:text="#{addArgument}">Add argument</a>

<table class="table">
  <tr th:each="arg: ${rootAruments}">
    <td>
    <div class="card">
      <div class="card-header">
        Argument
      </div>
      <div class="card-body">
        <table class="table table-striped">
          <tr>
            <td th:text="#{predicate}">Predicate</td>
            <td th:text="${arg.predicate}"></td>
          </tr>
          <tr>
            <td></td>
            <td>, <i th:text="#{because}">because</i></td>
          </tr>
          <tr>
            <td th:text="#{premise}">Premise</td>
            <td th:text="${arg.premise}"></td>
          </tr>
          <tr>
            <td th:text="#{warrant}">Warrant</td>
            <td th:text="${arg.warrant}"></td>
          </tr>
          <tr>
            <td th:text="#{source}">Source</td>
            <td th:text="${arg.source?.name}"></td>
          </tr>
        </table>
        <a th:href="@{__${case.id}__/arguments/__${arg.id}__/detail}" class="btn btn-primary" th:text="#{detail}">Detail</a>
      </div>
    </div>
    </td>
  </tr>

</table>
<script>
  // Function to hide the success and error messages after 3 seconds
  function hideMessages() {
    setTimeout(function () {
      document.getElementById("success-message").style.display = "none";
      document.getElementById("error-message").style.display = "none";
    }, 3000); // 3000 milliseconds (3 seconds)
  }

  // Call the function to hide messages
  hideMessages();
</script>

</body>


</html>
